<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Win Predictor - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("{{ url_for('static', filename='ipl2.jpg') }}"); /* Replace 'background.jpg' with your image URL */
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        h1 {
            color: #333;
            width: 100%;
            text-align: center;
        }

        .form-column {
            flex: 1;
            padding: 10px;
        }

        .team-select {
            width: 100%;
            padding: 10px;
        }

        label, select, input {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #ff5722;
            color: #fff;
            border: none;
            cursor: pointer;
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #e64a19;
        }

        a {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #ff5722;
            margin-top: 15px;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <form action="{{ url_for('predict') }}" method="post">
        <h1>IPL Win Predictor</h1>
        <div class="form-column">
            <label for="batting_team">Batting Team:</label>
            <select class="team-select" name="batting_team" id="batting_team">
                {% for team in teams %}
                    <option value="{{ team }}">{{ team }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-column">
            <label for="bowling_team">Bowling Team:</label>
            <select class="team-select" name="bowling_team" id="bowling_team">
                {% for team in teams %}
                    <option value="{{ team }}">{{ team }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-column">
            <label for="selected_city">Host City:</label>
            <select class="team-select" name="selected_city" id="selected_city">
                {% for city in cities %}
                    <option value="{{ city }}">{{ city }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-column">
            <label for="target">Target:</label>
            <input type="number" name="target" id="target" required>
        </div>

        <div class="form-column">
            <label for="balls_left">Balls Left:</label>
            <input type="text" name="balls_left" id="balls_left" required>
        </div>

        <div class="form-column">
            <label for="total_runs_x">Total Runs Expected:</label>
            <input type="number" name="total_runs_x" id="total_runs_x" required>
        </div>
        <div class="form-column">
            <label for="crr">Current Run Rate (CRR):</label>
            <input type="number" name="crr" id="crr" step="0.01" required>
        </div>
        <div class="form-column">
            <label for="runs_left">Runs Left:</label>
            <input type="number" name="runs_left" id="runs_left" required>
        </div>
        
        

        <div class="form-column">
            <label for="score">Score:</label>
            <input type="number" name="score" id="score" required>
        </div>

        <div class="form-column">
            <label for="overs">Overs Completed:</label>
            <input type="number" name="overs" id="overs" required>
        </div>

        <div class="form-column">
            <label for="wickets">Wickets Out:</label>
            <input type="number" name= "wickets" id="wickets" required>
        </div>
        <div class="form-column">
            <label for="rrr">Required Run Rate (RRR):</label>
            <input type="number" name="rrr" id="rrr" step="0.01" required>
        </div>
        <div class="form-column">
            <label for="total_runs_x">Total Runs Expected:</label>
            <input type="number" name="total_runs_x" id="total_runs_x" required>
        </div>
        
        <div class="form-column">
            <label for="balls_left">Balls Left:</label>
            <input type="number" name="balls_left" id="balls_left" required>
        </div>
        
        

        <button type="submit">Predict</button>
    </form>
    <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
